<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="pa-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Main Emblem Gradient (Fuchsia -> Purple -> Cyan) -->
    <linearGradient id="pa-emblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="25%" stop-color="#e879f9"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- AI Sparkle Star Gradient -->
    <linearGradient id="pa-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="pa-glow-ambient" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="pa-glow-icon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#pa-bg)" stroke="url(#pa-border)" stroke-width="12" />

  <!-- Ambient Glow Behind Icon -->
  <circle cx="210" cy="230" r="120" fill="#d946ef" opacity="0.22" filter="url(#pa-glow-ambient)" />
  <circle cx="350" cy="170" r="100" fill="#38bdf8" opacity="0.25" filter="url(#pa-glow-ambient)" />

  <!-- Icon Emblem Group -->
  <g filter="url(#pa-glow-icon)">
    <!-- Stylized "P" -->
    <path d="
      M 144 116
      C 144 100.5 156.5 88 172 88
      L 252 88
      C 309.4 88 356 134.6 356 192
      C 356 249.4 309.4 296 252 296
      L 208 296
      L 208 396
      C 208 411.5 195.5 424 180 424
      L 172 424
      C 156.5 424 144 411.5 144 396
      Z
    " fill="url(#pa-emblem)"/>

    <!-- P Inner Cutout -->
    <path d="
      M 208 148
      L 248 148
      C 272.3 148 292 167.7 292 192
      C 292 216.3 272.3 236 248 236
      L 208 236
      Z
    " fill="#0b0f19"/>

    <!-- Dynamic AI Sparkle Beacon (Upper Right) -->
    <path d="M 364 74 Q 364 142 432 142 Q 364 142 364 210 Q 364 142 296 142 Q 364 142 364 74 Z" fill="url(#pa-spark)"/>
    
    <!-- Spark Center Highlight -->
    <circle cx="364" cy="142" r="9" fill="#ffffff" />

    <!-- Accent Micro Sparkle (Bottom Left) -->
    <path d="M 112 324 Q 112 342 130 342 Q 112 342 112 360 Q 112 342 94 342 Q 112 342 112 324 Z" fill="#38bdf8" opacity="0.85"/>
  </g>
</svg>
